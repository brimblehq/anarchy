# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: brimble

before:
  hooks:
    - go mod tidy
    - sh scripts/completions.sh

builds:
  - id: brimble
    main: ./cmd/brimble
    binary: brimble
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/brimblehq/anarchy/internal/cmd.version={{.Version}}
      - -X github.com/brimblehq/anarchy/internal/cmd.commit={{.ShortCommit}}
      - -X github.com/brimblehq/anarchy/internal/cmd.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

# Homebrew cask in the tap repo: brew install brimblehq/tap/brimble
# Pushed over SSH with the tap's deploy key (HOMEBREW_TAP_DEPLOY_KEY);
# without it the cask is generated but not pushed.
homebrew_casks:
  - name: brimble
    binaries: [brimble]
    description: Deploy and manage apps on Brimble from your terminal
    homepage: https://brimble.io
    repository:
      owner: brimblehq
      name: homebrew-tap
      git:
        url: git@github.com:brimblehq/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    # Skip the tap push (but still build the cask) until the key is set.
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "") "" }}true{{ end }}'
    directory: Casks
    commit_author:
      name: brimble-bot
      email: bot@brimble.io
    commit_msg_template: "brimble {{ .Tag }}"
    completions:
      bash: completions/brimble.bash
      zsh: completions/brimble.zsh
      fish: completions/brimble.fish
    # The binary isn't notarized; drop the quarantine flag so macOS runs it.
    hooks:
      post:
        install: |
          if OS.mac? && system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/brimble"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: brimblehq
    name: anarchy
  extra_files:
    - glob: scripts/install.sh
  footer: >-

    ---

    ## Install

    ```bash
    # Homebrew (macOS, Linux)
    brew install brimblehq/tap/brimble

    # Install script (macOS, Linux)
    curl -fsSL {{ envOrDefault "INSTALL_SCRIPT_URL" (printf "https://github.com/brimblehq/anarchy/releases/download/%s/install.sh" .Tag) }} | sh

    # From source
    go install github.com/brimblehq/anarchy/cmd/brimble@{{ .Tag }}
    ```

    On Windows, download the zip for your architecture from the assets above.
