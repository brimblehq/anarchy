name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub release and Homebrew
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # GoReleaser treats an unparseable private_key as a path, so check it first.
      - name: Check Homebrew tap deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; the Homebrew step will be skipped."
            exit 0
          fi
          key="$RUNNER_TEMP/tap_deploy_key"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          if ! ssh-keygen -y -f "$key" > "$key.pub" 2>/dev/null; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not a valid unencrypted private key. Set it again from the private key file (not the .pub)."
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf "$key.pub")"
          out=$(ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -F /dev/null -T git@github.com 2>&1 || true)
          echo "$out"
          case "$out" in
            *"successfully authenticated"*) ;;
            *) echo "::error::GitHub rejected HOMEBREW_TAP_DEPLOY_KEY. Its public key must be a write deploy key on brimblehq/homebrew-tap (compare the fingerprint above with gh repo deploy-key list --repo brimblehq/homebrew-tap)."; exit 1 ;;
          esac
          echo "HOMEBREW_TAP_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_SCRIPT_URL: ${{ vars.INSTALL_BUCKET && format('https://{0}.t3.tigrisfiles.io/install.sh', vars.INSTALL_BUCKET) || '' }}

  install-script:
    name: Upload install script to Tigris
    needs: release
    if: vars.INSTALL_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload install.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          BUCKET: ${{ vars.INSTALL_BUCKET }}
        run: |
          aws s3 cp scripts/install.sh "s3://$BUCKET/install.sh" \
            --endpoint-url https://t3.storage.dev \
            --content-type "text/x-shellscript; charset=utf-8" \
            --cache-control "public, max-age=300"
          echo "Install with: curl -fsSL https://$BUCKET.t3.tigrisfiles.io/install.sh | sh"

  verify-install:
    name: Verify install (${{ matrix.os }})
    needs: [release, install-script]
    if: always() && needs.release.result == 'success' && needs.install-script.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Install with the published script
        env:
          SCRIPT_URL: ${{ vars.INSTALL_BUCKET && format('https://{0}.t3.tigrisfiles.io/install.sh', vars.INSTALL_BUCKET) || format('https://github.com/{0}/releases/download/{1}/install.sh', github.repository, github.ref_name) }}
          BRIMBLE_VERSION: ${{ github.ref_name }}
          BRIMBLE_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          curl -fsSL "$SCRIPT_URL" -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh"

      - name: Check the installed version
        run: |
          out=$("${{ runner.temp }}/bin/brimble" --version)
          echo "$out"
          case "$out" in
            *"${GITHUB_REF_NAME#v}"*) ;;
            *) echo "expected version ${GITHUB_REF_NAME#v}"; exit 1 ;;
          esac
